<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recharge Wallet - NammaStocks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 0;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .card-header {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .amount-btn {
            margin: 5px;
            padding: 10px 20px;
            border-radius: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header text-center">
                💰 Recharge Wallet
            </div>
            <div class="card-body">
                <!-- CHANGED: method from "get" to "post" to match your controller -->
                <form action="/recharge-wallet" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Select Amount (₹)</label>
                        <div class="d-flex flex-wrap justify-content-center">
                            <button type="button" class="btn btn-outline-success amount-btn" onclick="setAmount(100)">₹100</button>
                            <button type="button" class="btn btn-outline-success amount-btn" onclick="setAmount(500)">₹500</button>
                            <button type="button" class="btn btn-outline-success amount-btn" onclick="setAmount(1000)">₹1,000</button>
                            <button type="button" class="btn btn-outline-success amount-btn" onclick="setAmount(5000)">₹5,000</button>
                            <button type="button" class="btn btn-outline-success amount-btn" onclick="setAmount(10000)">₹10,000</button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Or Enter Custom Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" 
                                   class="form-control" 
                                   id="amount" 
                                   name="amount" 
                                   placeholder="Enter amount" 
                                   step="1" 
                                   required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Proceed to Payment
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="/wallet" class="btn btn-secondary">← Back to Wallet</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setAmount(value) {
            document.getElementById('amount').value = value;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
