<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Purchase - NammaStocks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 0;
        }
        .card {
            border-radius: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card-header {
            background: #2e7d32;
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .btn-success {
            background: #2e7d32;
            width: 100%;
            padding: 12px;
            font-size: 18px;
        }
        .btn-secondary {
            width: 100%;
            margin-top: 10px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }
        .total {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
        }
        .insufficient {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            text-align: center;
        }
        .sufficient {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header text-center">
                Confirm Purchase
            </div>
            <div class="card-body">
                <div class="info-row">
                    <span>Stock:</span>
                    <strong th:text="${ticker}"></strong>
                </div>
                <div class="info-row">
                    <span>Price per share:</span>
                    <span>₹ <span th:text="${price}"></span></span>
                </div>
                <div class="info-row">
                    <span>Quantity:</span>
                    <span th:text="${quantity}"></span>
                </div>
                <div class="info-row">
                    <span>Your Wallet Balance:</span>
                    <span>₹ <span th:text="${wallet}"></span></span>
                </div>
                <div class="info-row">
                    <span>Total Amount:</span>
                    <strong class="total">₹ <span th:text="${totalPrice}"></span></strong>
                </div>

                <div th:if="${wallet < totalPrice}" class="insufficient">
                    Insufficient balance! Need ₹ <span th:text="${totalPrice - wallet}"></span> more.
                </div>

                <div th:if="${wallet >= totalPrice}" class="sufficient">
                    Sufficient balance! You can proceed.
                </div>

                <form action="/confirm-buy" method="post" th:if="${wallet >= totalPrice}">
                    <input type="hidden" name="ticker" th:value="${ticker}">
                    <input type="hidden" name="quantity" th:value="${quantity}">
                    <input type="hidden" name="price" th:value="${totalPrice}">
                    <button type="submit" class="btn btn-success mt-3">
                        Confirm Purchase
                    </button>
                </form>

                <a href="/view-stocks" class="btn btn-secondary">Cancel</a>
            </div>
        </div>
    </div>
</body>
</html>
